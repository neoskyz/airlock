# Five policies. Decimal amounts are USD; budget resets Monday 00:00 UTC.
currency: USD
single_transaction_limit: 1000
daily_limit: 2000
period: weekly
# Risk feature used by the fifth policy, not an independent policy.
auto_approve_threshold: 50
allowed_payees:
  - shop@chargers.example
unknown_payee_action: REQUIRE_APPROVAL
blocked_categories:
  - gift cards
  - crypto
  - gambling
risk_approval_threshold: 60
risk_block_threshold: 85
enabled:
  single_transaction: true
  period_budget: true
  allowlist: true
  categories: true
  risk_threshold: true
# Editable scoring parameters for risk-based approval (policy 5).
velocity_window_seconds: 60
velocity_call_threshold: 3
review_min_score: 30
risk_weights:
  unknown_payee: 18
  unknown_merchant: 50
  new_payee: 20
  not_requested: 30
  negated: 50
  over_budget: 20
  above_auto_approve_limit: 20
  payout_tool: 24
  velocity: 10
  unknown_merchant_velocity: 4
  untrusted_source: 40
  category: 5
