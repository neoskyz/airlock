services:
  - type: web
    name: airlock
    runtime: python
    plan: free
    buildCommand: >-
      npm ci --prefix frontend &&
      npm run build --prefix frontend &&
      python -m pip install uv &&
      uv sync --frozen --no-dev
    startCommand: uv run --no-sync uvicorn airlock.app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.12
      - key: NODE_VERSION
        value: 22.21.1
      - key: RUN_RATE_LIMIT_PER_MINUTE
        value: '5'
      - key: RUN_RATE_LIMIT_PER_HOUR
        value: '30'
      - key: DAILY_LLM_CALL_LIMIT
        value: '500'
      - key: AGENT_MODE
        value: live
      - key: AGENT_PROVIDER
        value: openai
      - key: AGENT_MODEL
        value: gpt-4o-mini
      - key: JUDGE_MODEL
        value: claude-haiku-5-5
      - key: DEMO_MODE
        value: 'false'
      - key: SQLITE_PATH
        value: data/audit.sqlite3
      - key: POLICY_PATH
        value: policies/default.yaml
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_SHOP_EMAIL
        value: shop@chargers.example
      - key: PAYPAL_CONTRACTOR_EMAIL
        value: contractor@contractor.example
