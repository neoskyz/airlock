[project]
name = "airlock"
version = "0.1.0"
description = "A payment firewall for AI agents — PayPal hackathon demo"
requires-python = ">=3.13,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "anthropic>=2.3,<3", "httpx>=0.27,<1", "PyYAML>=6,<7", "python-dotenv>=1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["airlock", "firewall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
